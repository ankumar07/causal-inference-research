[project]
name = "decision-proof"
version = "0.1.0"
description = "A causal verification layer for business decisions."
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "pyfixest",
    "cvxpy",
    "joblib",
    "duckdb",
    "pydantic>=2",
    "streamlit",
    "plotly",
    "anthropic",
    "wildboottest>=0.3.2",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_proof"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.workspace]
members = ["."]
